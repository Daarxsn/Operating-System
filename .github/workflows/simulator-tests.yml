name: XyrisOS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  simulator-tests:
    name: Build and Test XyrisSim
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc

      - name: Configure simulator
        run: |
          cmake -S simulator \
                -B simulator/build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug

      - name: Build simulator
        run: |
          cmake --build simulator/build

      - name: Run simulator test suite
        run: |
          ctest --test-dir simulator/build --output-on-failure

      - name: Run simulator test script
        run: |
          ./scripts/simulator-test.sh

      - name: Check for whitespace errors
        run: |
          git diff --check

  kernel-build:
    name: Build XyrisOS Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc

      - name: Build XyrisOS kernel
        run: |
          ./scripts/build.sh

      - name: Check for whitespace errors
        run: |
          git diff --check

  validation:
    name: Full XyrisOS Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc binutils xorriso qemu-system-x86

      - name: Run full validation pipeline
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: Upload XyrisOS ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XyrisOS-ISO
          path: XyrisOS.iso
          if-no-files-found: warn

      - name: Upload QEMU runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QEMU-runtime-log
          path: build/qemu-runtime.log
          if-no-files-found: warn

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - simulator-tests
      - kernel-build
      - validation

    steps:
      - name: Report successful CI completion
        run: |
          echo "=========================================="
          echo "       XyrisOS CI COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo "Simulator build: PASSED"
          echo "Simulator tests: PASSED"
          echo "Kernel build:    PASSED"
          echo "Code quality:    PASSED"